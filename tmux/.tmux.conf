# ~/.tmux.conf — minimal Primeagen-flavored config
# Reload with:  prefix + r   (or `tmux source ~/.tmux.conf`)

# ── Prefix ────────────────────────────────────────────────────────────────
# C-a is friendlier than C-b and doesn't fight readline's start-of-line.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor passthrough
set -sg escape-time 0                       # no delay on <Esc> (vim/nvim)
set -g history-limit 100000
set -g mouse on
setw -g mode-keys vi                        # vi-style copy mode

# Start indexes at 1 and renumber when windows close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Bindings ──────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Splits open in the current pane's working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix + f → tmux-sessionizer (mirrors the Ctrl+F binding in ~/.zsh_profile,
# but reachable when Ctrl+F is captured by another program).
bind-key -r f run-shell "tmux neww tmux-sessionizer"

# ── Status bar ────────────────────────────────────────────────────────────
set -g status-position top
set -g status-style "bg=default fg=white"
set -g status-left  "#[fg=green,bold][#S] "
set -g status-right "#[fg=yellow]%Y-%m-%d #[fg=white]%H:%M "
set -g status-right-length 50
